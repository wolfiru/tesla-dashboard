<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232a4d"/><stop offset="1" stop-color="#0c0f1f"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00c851"/><stop offset=".55" stop-color="#19d3a2"/><stop offset="1" stop-color="#3ec6ff"/></linearGradient>
    <linearGradient id="blitz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe9ff"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <!-- Skala: 270°-Bogen, offen nach unten -->
  <path d="M 158 374 A 138 138 0 1 1 354 374" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="52" stroke-linecap="round"/>
  <path d="M 158 374 A 138 138 0 1 1 354 374" fill="none" stroke="url(#ring)" stroke-width="52" stroke-linecap="round" stroke-dasharray="560 2000" filter="url(#glow)"/>
  <!-- Blitz -->
  <path d="M 290 130 L 182 286 H 246 L 220 396 L 334 230 H 268 Z" fill="url(#blitz)" stroke="#0c0f1f" stroke-width="6" stroke-linejoin="round"/>
</svg>
